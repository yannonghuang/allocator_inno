# Prod overrides: no source mounts, use production Dockerfiles
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./csv:/app/csv:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes: []
    environment:
      API_BACKEND_URL: http://backend:8000
    command: node server.js
